<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" rx="12" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accent)"/>

  <!-- Icon circle -->
  <circle cx="72" cy="82" r="36" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="72" y="90" font-family="monospace" font-size="26" fill="#3b82f6" text-anchor="middle" font-weight="bold">PQ</text>

  <!-- Main title -->
  <text x="130" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">ParseIQ</text>

  <!-- Tagline -->
  <text x="130" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#94a3b8">AI-Powered Data Quality Agent</text>

  <!-- pip install badge -->
  <rect x="130" y="115" width="200" height="26" rx="5" fill="#1e3a5f"/>
  <text x="145" y="133" font-family="'Courier New', monospace" font-size="13" fill="#60a5fa">pip install parseiq</text>

  <!-- Right side stats -->
  <text x="600" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13" fill="#64748b" text-anchor="middle">Supports</text>

  <text x="540" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" fill="#94a3b8">JSON · CSV · XML · Excel</text>

  <text x="540" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" fill="#94a3b8">OpenAI · Claude · Gemini · Ollama</text>

  <text x="540" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" fill="#94a3b8">159 tests · MIT License</text>
</svg>
