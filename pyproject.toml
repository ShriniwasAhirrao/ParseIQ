[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseiq"
version = "0.0.2"
description = "AI-powered data quality and metadata analysis agent"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Shriniwas Ahirrao", email = "shriniwasahirrao@gmail.com" }
]
requires-python = ">=3.9"
keywords = ["data-quality", "metadata", "data-profiling", "llm", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "openpyxl>=3.1.0",
    "chardet>=5.2.0",
    "xmltodict>=0.13.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
llm = ["python-dotenv>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
gemini = ["google-generativeai>=0.5.0"]
s3 = ["boto3>=1.26.0"]
postgres = ["psycopg2-binary>=2.9.0"]
mongodb = ["pymongo>=4.0.0"]
alerts = ["python-dotenv>=1.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
]
all = [
    "python-dotenv>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "boto3>=1.26.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.0.0",
]

[project.scripts]
parseiq = "parseiq._cli:main"

[project.urls]
Homepage = "https://github.com/ShriniwasAhirrao/ParseIQ-V0.0.1"
Repository = "https://github.com/ShriniwasAhirrao/ParseIQ-V0.0.1"

[tool.setuptools.packages.find]
where = ["."]
include = ["parseiq*"]

[tool.setuptools.package-data]
parseiq = ["step2_llm_enricher/prompt_template.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
